<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品开发项目管理表单</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- 页面过渡动画层 -->
    <div id="pageTransition" class="page-transition">
        <div class="page-transition-spinner"></div>
    </div>

    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <h1>蓝橙产品开发项目管理</h1>
                <p>请登录以继续</p>
            </div>
            
            <!-- 登录表单 -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码（至少6位）" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
                <p class="form-switch">还没有账号？<a href="#" id="showRegister">立即注册</a></p>
            </form>
            
            <!-- 注册表单 -->
            <form id="registerForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="regEmail">邮箱</label>
                    <input type="email" id="regEmail" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-green btn-block">注册</button>
                <p class="form-switch">已有账号？<a href="#" id="showLogin">返回登录</a></p>
            </form>
        </div>
    </div>

    <!-- 主应用界面 -->
    <div id="mainApp" class="container" style="display: none;">
        <!-- 头部 -->
        <header class="header">
            <div class="header-title-container">
                <h1>蓝橙产品开发项目管理</h1>
                <button id="newProjectBtn" class="btn btn-green">新增项目</button>
            </div>
            <div class="header-actions">
                <!-- 同步状态显示 -->
                <div id="syncStatus" class="sync-status offline">🔴 离线模式</div>
                <!-- 在线用户显示 -->
                <div class="online-users">
                    <span class="online-indicator"></span>
                    <span id="currentUserDisplay">当前用户：加载中...</span>
                </div>
                <button id="exportHtmlBtn" class="btn btn-secondary">导出HTML</button>
                <button id="exportImageBtn" class="btn btn-secondary">导出图片</button>
                <button id="logoutBtn" class="btn btn-danger">退出登录</button>
            </div>
        </header>

        <!-- 项目列表 -->
        <section class="project-list-section">
            <div class="project-list-header">
                <h2>项目列表</h2>
                <div class="sort-controls">
                    <label for="searchInput">搜索：</label>
                    <input type="text" id="searchInput" placeholder="输入项目名称或关键词">
                    <label for="sortBy">排序方式：</label>
                    <select id="sortBy">
                        <option value="default">默认</option>
                        <option value="progress">按进度</option>
                        <option value="priority">按优先级</option>
                        <option value="launchDate">按上市时间</option>
                    </select>
                    <button id="exportDataBtn" class="btn btn-small">导出项目数据</button>
                    <button id="importDataBtn" class="btn btn-small">加载项目数据</button>
                    <input type="file" id="importFile" style="display: none;" accept=".json">
                </div>
            </div>
            <div id="projectList" class="project-list"></div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
